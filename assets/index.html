<!DOCTYPE html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{{COLOR_SCHEME}}">
<title>{{TITLE}} · mdpv</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
{{CSS_LINKS}}
<link rel="stylesheet" href="/assets/mdpv.css?v={{V}}">
<script type="application/json" id="mdpv-boot">{{BOOT}}</script>
<script defer src="/assets/vendor/markdown-it.min.js?v={{V}}"></script>
<script defer src="/assets/vendor/markdown-it-task-lists.min.js?v={{V}}"></script>
<script defer src="/assets/vendor/markdown-it-footnote.min.js?v={{V}}"></script>
<script defer src="/assets/vendor/markdown-it-emoji.min.js?v={{V}}"></script>
<script defer src="/assets/vendor/purify.min.js?v={{V}}"></script>
<script defer src="/assets/vendor/morphdom-umd.min.js?v={{V}}"></script>
<script defer src="/assets/vendor/highlight.min.js?v={{V}}"></script>
<script defer src="/assets/app.js?v={{V}}"></script>
</head>
<body>
<main>
  <article id="content" class="markdown-body" aria-live="polite">
    <p class="mdpv-loading">Connecting to Neovim&hellip;</p>
  </article>
</main>
<div id="mdpv-fab" data-status="live" data-corner="br">
  <div id="fab-menu" hidden>
    <div id="status" title="Connected — updates live as you edit">
      <span class="dot"></span><span id="status-text">live</span>
    </div>
    <button type="button" id="follow-toggle" hidden aria-pressed="true"
      title="Scroll the preview to follow the cursor in Neovim">Follow cursor<span class="fab-switch"></span></button>
    <button type="button" id="theme-toggle"
      title="Cycle between auto, light, and dark">Theme<span class="fab-value" id="theme-value">{{THEME}}</span></button>
    <button type="button" id="width-toggle" aria-pressed="false"
      title="Let the page span the full window width">Full width<span class="fab-switch"></span></button>
    <button type="button" id="top-button" title="Scroll back to the top">Go to top</button>
  </div>
  <button type="button" id="fab-toggle" aria-haspopup="true" aria-expanded="false" title="mdpv">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14.85 3H1.15C.52 3 0 3.52 0 4.15v7.69C0 12.48.52 13 1.15 13h13.69c.64 0 1.15-.52 1.15-1.15v-7.7C16 3.52 15.48 3 14.85 3ZM9 11H7V8L5.5 9.92 4 8v3H2V5h2l1.5 2L7 5h2v6Zm2.99.5L9.5 8H11V5h2v3h1.5l-2.51 3.5Z"/></svg>
    <span class="dot"></span>
  </button>
</div>
</body>
</html>
